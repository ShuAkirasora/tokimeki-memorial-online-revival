# The one thing a stranger's clone has to be able to do: compile, start, answer
# on its ports, stop. No client is involved, so nothing here says anything about
# the protocol -- a green run means the tree is intact, not that the game works.
name: server starts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  start-stop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile everything
        run: python -m compileall -q .

      - name: Start, confirm the ports answer, stop
        run: |
          python start_servers.py
          python - <<'PY'
          import os, socket, sys, time
          # The ports the game and a browser reach; 443 and below need root on
          # Linux and start_servers.py reports them as skipped, so not those.
          ports = [12000, 12013, 35573, 25573, 25574, 25575]
          pid = int(open("runtime/run_all.pid").read())
          deadline = time.monotonic() + 60
          while ports:
              try:
                  os.kill(pid, 0)
              except OSError:
                  sys.exit(f"server pid {pid} is gone before the ports answered")
              for port in list(ports):
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=2):
                          pass
                  except OSError:
                      continue
                  print(f"port {port} answers")
                  ports.remove(port)
              if ports and time.monotonic() > deadline:
                  sys.exit(f"still not answering after 60 s: {ports}")
              if ports:
                  time.sleep(1)
          PY
          python stop_servers.py | tee stop.txt
          grep -q '^stopped:' stop.txt

      - name: Log tail
        if: always()
        run: tail -n 80 runtime/run_all.log || true
